<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المساعد الذكي | محمد فتحي</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .chat-container { 
            width: 90%; max-width: 800px; background: var(--card-bg); 
            border-radius: 15px; padding: 20px; margin-top: 30px; 
            display: flex; flex-direction: column; height: 600px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #chatBox { 
            flex-grow: 1; overflow-y: auto; display: flex; 
            flex-direction: column; gap: 15px; padding: 10px;
        }
        .msg { 
            padding: 12px 18px; border-radius: 15px; 
            max-width: 85%; line-height: 1.8; font-size: 14px;
            animation: fadeInUp 0.3s ease;
        }
        .user-msg { 
            background: var(--accent-color); align-self: flex-end; 
            color: white; border-bottom-right-radius: 2px; 
        }
        .bot-msg { 
            background: var(--input-bg); align-self: flex-start; 
            color: var(--text-color); border-bottom-left-radius: 2px; 
            border-right: 4px solid var(--accent-color);
        }
        .bot-msg pre {
            background: var(--bg-color); padding: 12px; border-radius: 8px;
            overflow-x: auto; direction: ltr; text-align: left;
            margin: 10px 0; border-left: 3px solid var(--success-color);
        }
        .bot-msg code {
            font-family: 'Consolas', monospace; font-size: 13px; color: #4CAF50;
        }
        .input-area { 
            display: flex; gap: 10px; padding-top: 20px;
            border-top: 1px solid var(--border-color);
        }
        input#userQuery { 
            flex-grow: 1; padding: 15px; border-radius: 10px; 
            border: 1px solid var(--border-color); background: var(--input-bg); 
            color: var(--text-color); font-size: 15px;
        }
        .typing-indicator {
            display: flex; gap: 5px; padding: 15px; align-self: flex-start;
        }
        .typing-indicator span {
            width: 8px; height: 8px; background: var(--accent-color);
            border-radius: 50%; animation: typing 1.4s infinite ease-in-out both;
        }
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes typing {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="fade-in" style="padding-top: 20px;">
        <div id="userInfo" style="color: var(--text-color); text-align: right; margin-bottom: 15px; font-size: 14px;"></div>
        
        <div class="chat-container">
            <div id="chatBox">
                <div class="msg bot-msg">
                    <strong>👋 مرحباً بك يا زميلي!</strong><br><br>
                    أنا <strong>مساعدك الذكي</strong> للبرمجة.<br>
                    يمكنني مساعدتك في:<br>
                    • كتابة وشرح الأكواد البرمجية 📝<br>
                    • حل المشاكل البرمجية 🔧<br>
                    • تعلم لغات جديدة 📚<br>
                    • مراجعة وتحسين الكود ✨
                </div>
            </div>
            <div class="input-area">
                <input type="text" id="userQuery" placeholder="اكتب سؤالك البرمجي هنا..." onkeypress="if(event.key==='Enter') askAI()">
                <button id="sendButton" onclick="askAI()" style="padding: 15px 25px; white-space: nowrap;">إرسال ➤</button>
            </div>
        </div>
    </main>

    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="common.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const auth = getAuth();
            if (auth) {
                updateNavAuth();
                const loginLink = document.getElementById('loginNav');
                if (loginLink) loginLink.style.display = 'none';
                document.getElementById('userInfo').innerHTML = 
                    `مرحباً <strong>${auth.name}</strong> | الصلاحية: <span style="color:var(--success-color)">${auth.role}</span>`;
            }
        });

        async function askAI() {
            const queryInput = document.getElementById('userQuery');
            const query = queryInput.value.trim();
            const chatBox = document.getElementById('chatBox');
            const sendButton = document.getElementById('sendButton');
            
            if (!query) return;

            chatBox.innerHTML += `<div class="msg user-msg">${escapeHtml(query)}</div>`;
            queryInput.value = '';
            sendButton.disabled = true;

            const loadingId = 'typing-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = loadingId;
            loadingDiv.className = 'typing-indicator';
            loadingDiv.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetchWithAuth(`${BACKEND_BASE_URL}/ask-ai`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ query: query })
                });
                
                const data = await response.json();
                
                document.getElementById(loadingId)?.remove();
                
                const botMsg = document.createElement('div');
                botMsg.className = 'msg bot-msg';
                botMsg.innerHTML = formatResponse(data.response || 'عذراً، لم يصل رد.');
                chatBox.appendChild(botMsg);
                
            } catch (error) {
                document.getElementById(loadingId)?.remove();
                
                const botMsg = document.createElement('div');
                botMsg.className = 'msg bot-msg';
                botMsg.style.borderRightColor = 'var(--error-color)';
                botMsg.innerHTML = `
                    <strong style="color:var(--error-color)">⚠️ خطأ في الاتصال</strong><br><br>
                    ${escapeHtml(error.message)}<br><br>
                    <small>💡 جرب:</small><br>
                    • تحديث الصفحة (F5)<br>
                    • التأكد من تشغيل Backend على Render
                `;
                chatBox.appendChild(botMsg);
            } finally {
                sendButton.disabled = false;
                chatBox.scrollTop = chatBox.scrollHeight;
            }
        }

        function formatResponse(text) {
            text = text.replace(/```(\w+)?\n([\s\S]*?)```/g, (match, lang, code) => {
                return `<pre><code>${escapeHtml(code)}</code></pre>`;
            });
            text = text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            text = text.replace(/### (.*)/g, '<strong style="color:var(--accent-color);display:block;margin-top:15px;">$1</strong>');
            text = text.replace(/## (.*)/g, '<strong style="color:var(--accent-color);font-size:16px;display:block;margin-top:15px;">$1</strong>');
            return text;
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }
    </script>
</body>
</html>
