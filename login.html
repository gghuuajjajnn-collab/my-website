<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول | مستودع الأكواد</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="navContainer"></div>
    
    <main class="slide-up" style="margin-top: 100px;">
        <div class="code-card" style="max-width: 400px; text-align: center;">
            <h2>تسجيل دخول الطلاب</h2>
            
            <!-- حاوية زر جوجل -->
            <div id="googleButton" style="width:100%; margin-top: 20px;"></div>
            <div id="authMessage" style="margin-top: 10px; font-size: 14px; color: #ffcccb;"></div>
            
            <div style="margin: 20px 0; color: #ccc; font-size: 14px; text-align: center;">أو سجل الدخول باسم المستخدم وكلمة المرور</div>
            
            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 0;">
                <input type="text" id="username" placeholder="اسم المستخدم" style="padding: 12px; border-radius: 8px; background: #2d2d2d; color: white; border: 1px solid #444;">
                <input type="password" id="password" placeholder="كلمة المرور" style="padding: 12px; border-radius: 8px; background: #2d2d2d; color: white; border: 1px solid #444;">
                <button onclick="handleLocalLogin()">دخول</button>
            </div>
            
            <p id="loginStatus" style="margin-top: 15px; font-size: 14px;"></p>
        </div>
    </main>

    <!-- استدعاء المكتبات الخارجية أولاً -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <!-- تأكد من وجود دالة getBackendBaseUrl داخل auth.js أو config.js -->

    <script>
        // دالة تسجيل الدخول المحلي (اسم المستخدم وكلمة المرور)
        async function handleLocalLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            
            // التأكد من وجود الرابط من ملف الإعدادات
            const backendUrl = typeof getBackendBaseUrl === 'function' ? getBackendBaseUrl() : BACKEND_BASE_URL;

            if (!backendUrl) {
                alert('خطأ: رابط الخادم غير مضبوط!');
                return;
            }

            try {
                const response = await fetch(`${backendUrl}/login`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await response.json();
                
                if (response.ok && data.status === "success") {
                    // حفظ البيانات في LocalStorage
                    setAuth({
                        token: data.token,
                        email: data.email || `${user}@local`, // الباكند المحلي قد لا يرسل إيميل
                        name: data.name,
                        role: data.role,
                        provider: 'local'
                    });
                    // التوجيه للصفحة الرئيسية
                    window.location.href = "index.html";
                } else {
                    const msg = data.message || "خطأ في بيانات الدخول";
                    if (typeof showAuthMessage === 'function') showAuthMessage(msg);
                    else alert(msg);
                }
            } catch (error) {
                console.error("Login Error:", error);
                alert("تعذر الاتصال بالخادم، تأكد أن رندر يعمل.");
            }
        }

        // تشغيل نظام التحقق عند تحميل الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            if (typeof handleLoginPage === 'function') {
                handleLoginPage(); 
            } else {
                initGoogleSignIn();
            }
        });
    </script>
</body>
</html>
