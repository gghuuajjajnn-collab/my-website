<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | مستودع الأكواد</title>
    <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body>
    <div id="navContainer"></div>

    <main class="slide-up" style="margin-top: 100px;">
        <div class="code-card" style="max-width: 400px; text-align: center;">
            <h2>تسجيل دخول الطلاب</h2>

            <div id="googleButton" style="width:100%; margin-top: 20px;"></div>
            <div id="authMessage" style="margin-top: 10px; font-size: 14px; color: #ffcccb;"></div>

            <div style="margin: 20px 0; color: #ccc; font-size: 14px; text-align: center;">أو سجل الدخول باسم المستخدم وكلمة المرور</div>

            <div style="display: flex; flex-direction: column; gap: 15px; margin-top: 0;">
                <input type="text" id="username" placeholder="اسم المستخدم" autocomplete="username">
                <input type="password" id="password" placeholder="كلمة المرور" autocomplete="current-password">
                <button onclick="handleLocalLogin()">دخول</button>
            </div>

            <p id="loginStatus" style="margin-top: 15px; font-size: 14px;"></p>
        </div>
    </main>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="common.js"></script>

    <script>
        async function handleLocalLogin() {
            const user = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value.trim();
            const backendUrl = getBackendBaseUrl();

            if (!backendUrl) {
                showAuthMessage('خطأ: رابط الخادم غير مضبوط في config.js');
                return;
            }

            try {
                const response = await fetch(`${backendUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    setAuth({
                        token: data.token,
                        email: data.email,
                        name: data.name,
                        role: data.role,
                        provider: 'local'
                    });
                    window.location.href = 'index.html';
                } else {
                    showAuthMessage(data.message || 'خطأ في بيانات الدخول');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAuthMessage('تعذر الاتصال بالخادم. تأكد من تشغيل Backend على Render.');
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof handleLoginPage === 'function') {
                handleLoginPage();
            } else {
                initGoogleSignIn();
            }
        });
    </script>
</body>
</html>
