<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحة التعليقات | مستودع الأكواد</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="comments.css">
   
</head>
<body>

    <div id="navContainer"></div>

    <header class="fade-in">
        <h1>صفحة التعليقات</h1>
        <p>اكتب اسمك وتعليقك وسنراه مباشرة!</p>
        <div style="margin-top: 10px; font-size: 14px; color: #888;">
            💬 التعليقات تظهر مباشرة للجميع • 📅 مرتبة من الأحدث للأقدم
        </div>
    </header>
    <main class="fade-in">
        <!-- نموذج التعليقات -->
        <div class="comment-form">
            <input type="text" id="nameInput" placeholder="اسمك">
            <textarea id="commentInput" placeholder="أترك تعليقك"></textarea>
            <button onclick="submitComment()">أرسل التعليق</button>
        </div>

        <!-- قائمة التعليقات -->
        <div id="commentsList" class="comments-list">
            <!-- التعليقات ستظهر هنا -->
        </div>
    </main>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <!-- سكربت التعليقات -->
    <script src="comments.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            updateNavAuth();
            const loginLink = document.getElementById('loginNav');
            if (loginLink) loginLink.style.display = 'none';
        });

        function showFavorites() {
            const favCodes = JSON.parse(localStorage.getItem('favorites')) || [];
            if (favCodes.length === 0) {
                showCustomAlert('لا توجد أكواد محفوظة في المفضلات');
                return;
            }
            
            let message = 'أكوادك المفضلة:\n\n';
            favCodes.forEach((code, index) => {
                message += `${index + 1}. ${code}\n`;
            });
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom';
            alertDiv.style.whiteSpace = 'pre-wrap';
            alertDiv.innerText = message;
            document.body.appendChild(alertDiv);
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        function showCustomAlert(message) {
            const existingAlerts = document.querySelectorAll('.alert-custom');
            existingAlerts.forEach(alert => alert.remove());
            
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom';
            alertDiv.innerHTML = message;
            document.body.appendChild(alertDiv);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }
    </script>
</body>
 <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="common.js"></script>
</html>
