<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المفضلات | مستودع الأكواد</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
    <script src="common.js"></script>
</head>
<body>
    <div id="navContainer"></div>

    <main class="fade-in" style="margin-top: 50px; width: 90%; max-width: 800px;">
        <div class="code-card">
            <h2>المفضلات ❤️</h2>
            <p id="favIntro" style="color: var(--text-color);">قائمة الأكواد التي قمت بحفظها.</p>
            <div id="favoritesList"></div>
        </div>
    </main>

    <script>
        // جلب الأكواد من Firebase أو المحلية
        async function getAllCodes() {
            // أولاً نجرب Firebase
            if (typeof firebase !== 'undefined') {
                try {
                    const snapshot = await firebase.database().ref('codes').once('value');
                    const codes = [];
                    snapshot.forEach(child => {
                        codes.push({...child.val(), key: child.key});
                    });
                    if (codes.length > 0) return codes;
                } catch(e) {
                    console.log('Firebase codes not available, using local');
                }
            }
            // fallback للأكواد المحلية
            return window.myCode || [];
        }

        async function renderFavorites() {
            const favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            const favList = document.getElementById('favoritesList');
            favList.innerHTML = '';

            if (favorites.length === 0) {
                favList.innerHTML = '<p style="text-align:center; color:var(--text-color); padding:20px;">لا توجد أكواد محفوظة في المفضلات.</p>';
                return;
            }

            const codes = await getAllCodes();
            
            favorites.forEach(title => {
                const item = codes.find(c => c.title === title || c.title === decodeURIComponent(title));
                const card = document.createElement('div');
                card.className = 'comment-card';
                card.style.cssText = 'padding:15px; margin-bottom:15px; border-radius:10px; border-right:4px solid var(--accent-color);';
                
                const safeTitle = encodeURIComponent(item ? item.title : title);
                
                card.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                        <div style="text-align:right; flex:1; min-width:200px;">
                            <strong style="font-size:18px; color:var(--accent-color);">${item ? item.title : title}</strong>
                            ${item ? `<br><small style="color:var(--success-color);">📝 ${item.lang}</small>` : ''}
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button onclick="viewFavorite('${safeTitle}')" style="padding:8px 15px; font-size:14px;">👁️ عرض</button>
                            <button onclick="removeFavorite('${safeTitle}')" style="padding:8px 15px; font-size:14px; background:var(--error-color);">🗑️ حذف</button>
                        </div>
                    </div>
                `;
                favList.appendChild(card);
            });
        }

        async function removeFavorite(encodedTitle) {
            const title = decodeURIComponent(encodedTitle);
            let favorites = JSON.parse(localStorage.getItem('favorites')) || [];
            favorites = favorites.filter(t => t !== title && t !== encodedTitle);
            localStorage.setItem('favorites', JSON.stringify(favorites));
            await renderFavorites();
            showCustomAlert('تم إزالة من المفضلات 💔');
            if (typeof updateNavAuth === 'function') updateNavAuth();
        }

        async function viewFavorite(encodedTitle) {
            const title = decodeURIComponent(encodedTitle);
            const codes = await getAllCodes();
            const item = codes.find(c => c.title === title);
            
            if (!item) {
                showCustomAlert('لم أتمكن من العثور على الكود.');
                return;
            }

            const popup = document.createElement('div');
            popup.style.cssText = `
                position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
                background:rgba(0,0,0,0.8); z-index:2000; padding:20px;
            `;
            
            const box = document.createElement('div');
            box.style.cssText = `
                background:var(--card-bg); color:var(--text-color); padding:25px;
                border-radius:15px; max-width:90%; max-height:85vh; overflow:auto;
                text-align:right; border:2px solid var(--accent-color); width:700px;
                box-shadow:0 20px 60px rgba(0,0,0,0.5);
            `;
            
            // Syntax highlighting بسيط
            const highlightedCode = highlightCode(item.code, item.lang);
            
            box.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:2px solid var(--border-color); padding-bottom:10px;">
                    <h3 style="margin:0; color:var(--accent-color);">${item.title}</h3>
                    <span style="background:var(--accent-color); color:white; padding:4px 12px; border-radius:20px; font-size:12px;">${item.lang}</span>
                </div>
                <div style="background:var(--bg-color); padding:15px; border-radius:8px; direction:ltr; text-align:left; overflow-x:auto; border-left:4px solid var(--accent-color);">
                    <pre style="margin:0; font-family:'Consolas', monospace; font-size:14px; line-height:1.6;"><code>${highlightedCode}</code></pre>
                </div>
                <div style="display:flex; gap:10px; justify-content:flex-start; margin-top:15px; flex-wrap:wrap;">
                    <button onclick="copyFavoriteCode('${encodedTitle}')" style="padding:8px 20px; font-size:14px;">📋 نسخ الكود</button>
                    <button onclick="this.closest('.popup-overlay').remove()" style="padding:8px 20px; font-size:14px; background:var(--border-color);">❌ إغلاق</button>
                </div>
            `;
            
            popup.className = 'popup-overlay';
            popup.appendChild(box);
            document.body.appendChild(popup);
            
            popup.onclick = (e) => {
                if (e.target === popup) popup.remove();
            };
        }

        function highlightCode(code, lang) {
            // تلوين بسيط للكود
            let html = escapeHtml(code);
            
            if (lang === 'Python') {
                html = html.replace(/\b(def|class|return|if|else|elif|for|while|import|from|try|except|with|as|print)\b/g, '<span style="color:#ff79c6;">$1</span>');
                html = html.replace(/\b(True|False|None)\b/g, '<span style="color:#bd93f9;">$1</span>');
                html = html.replace(/(#.*$)/gm, '<span style="color:#6272a4;">$1</span>');
                html = html.replace(/(".*?"|'.*?')/g, '<span style="color:#f1fa8c;">$1</span>');
            } else if (lang === 'JavaScript') {
                html = html.replace(/\b(function|return|var|let|const|if|else|for|while|try|catch|new|this|typeof)\b/g, '<span style="color:#ff79c6;">$1</span>');
                html = html.replace(/\b(true|false|null|undefined)\b/g, '<span style="color:#bd93f9;">$1</span>');
                html = html.replace(/(\/\/.*$)/gm, '<span style="color:#6272a4;">$1</span>');
                html = html.replace(/(".*?"|'.*?'|`.*?`)/g, '<span style="color:#f1fa8c;">$1</span>');
            } else if (lang === 'C++' || lang === 'Java') {
                html = html.replace(/\b(int|float|double|char|void|bool|return|if|else|for|while|class|public|private|include|using|namespace|std)\b/g, '<span style="color:#ff79c6;">$1</span>');
                html = html.replace(/\b(true|false|null)\b/g, '<span style="color:#bd93f9;">$1</span>');
                html = html.replace(/(\/\/.*$)/gm, '<span style="color:#6272a4;">$1</span>');
                html = html.replace(/(".*?")/g, '<span style="color:#f1fa8c;">$1</span>');
            }
            
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        async function copyFavoriteCode(encodedTitle) {
            const title = decodeURIComponent(encodedTitle);
            const codes = await getAllCodes();
            const item = codes.find(c => c.title === title);
            if (item) {
                navigator.clipboard.writeText(item.code);
                showCustomAlert('تم نسخ الكود بنجاح! ✅');
            }
        }

        function showCustomAlert(message) {
            const existing = document.querySelectorAll('.alert-custom');
            existing.forEach(a => a.remove());
            
            const alertDiv = document.createElement('div');
            alertDiv.className = 'alert-custom';
            alertDiv.innerHTML = message;
            alertDiv.style.cssText = `
                position:fixed; top:20px; right:20px; padding:15px 20px;
                background:var(--card-bg); color:var(--text-color);
                border-right:4px solid var(--accent-color); border-radius:10px;
                box-shadow:0 5px 15px rgba(0,0,0,0.3); z-index:1001;
                animation:slideInRight 0.5s ease-out; max-width:300px;
            `;
            document.body.appendChild(alertDiv);
            setTimeout(() => alertDiv.remove(), 3000);
        }

        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            updateNavAuth();
            renderFavorites();
        });
    </script>
</body>
</html>
