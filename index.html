<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودع الأكواد | محمد فتحي</title>
    <link rel="stylesheet" href="style.css">
    <script src="config.js"></script>
    <script src="auth.js"></script>
</head>
<body>
<script>
    function redirectToApp() {
        const auth = getAuth();
        if (!auth || !auth.email) {
            window.location.href = '/login';
        } else {
            window.location.href = '/ai';
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        try {
            if (typeof getAuth === 'function') {
                redirectToApp();
            } else {
                window.location.href = '/login';
            }
        } catch (e) {
            window.location.href = '/login';
        }
    });
</script>
    <nav class="navbar">
        <a href="/" class="active">الرئيسية</a>
        <a href="/ai">الذكاء الاصطناعي</a>
        <a href="/comments">تعليقاتكم</a>
        <a href="/login" id="loginNav">تسجيل الدخول</a>
        <a href="/about">من أنا</a>
        <button id="favoritesBtn" onclick="showFavorites()" style="background: none; border: none; color: white; font-size: 18px; cursor: pointer; margin-left: 15px; padding: 5px 10px; transition: 0.3s;">⭐ المفضلات</button>
    </nav>

    <header class="fade-in">
        <h1>مستودع أكواد الكلية</h1>
        <p>ابحث، انسخ، وتعلم بسرعة</p>
        
        <div class="search-section">
            <select id="langFilter">
                <option value="all">كل اللغات</option>
                <option value="C++">C++</option>
                <option value="Java">Java</option>
                <option value="Python">Python</option>
                <option value="JavaScript">JavaScript</option>
            </select>

            <div class="search-container">
                <input type="text" id="searchInput" placeholder="ابحث عن كود... (مثال: دالة الوقت)">
                <ul id="suggestionsList" class="suggestions-box"></ul>
            </div>
        </div>
    </header>

    <main>
        <div id="langHeader" style="display: none;" class="slide-up">
            <span id="displayLang" class="lang-badge"></span>
        </div>

        <div id="resultCard" class="code-card slide-up" style="display: none;">
            <h3 id="displayTitle"></h3>
            <pre><code id="displayCode"></code></pre>
            <button type="button" id="copyBtn" onclick="copyCode()">نسخ الكود</button>
        </div>

        <div id="welcomeMessag" class="fade-in">
            <p>اكتب اسم الكود أو اختر اللغة للبدء...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 جميع الحقوق محفوظة | تصميم وبرمجة: محمد فتحي جعفر</p>
        <div id="assistant">
            <img src="robot.png" id="assistantImg">
            <div id="assistantMessage">مرحبا 👋 اكتب اسم الكود</div>
        </div>
        
    </footer>

     <script src="script.js"></script>
</body>
</html>
